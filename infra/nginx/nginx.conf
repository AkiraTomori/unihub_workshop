worker_processes 1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Blueprint-driven rate limit zones (per-client IP)
    # - Login: protect credential abuse (5 requests per minute)
    # - Register: low volume allowed (3 requests per minute)
    # - Refresh token: moderate (10 requests per minute)
    # - Registrations (checkout): higher but limited to prevent abuse (200 requests per minute)
    # - Default API: keep higher rate for normal traffic (20 requests per second)
    limit_req_zone $binary_remote_addr zone=perip_login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=perip_register:10m rate=3r/m;
    limit_req_zone $binary_remote_addr zone=perip_refresh:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=perip_registrations:10m rate=200r/m;
    limit_req_zone $binary_remote_addr zone=perip_default:10m rate=20r/s;

    server {
        listen 8080;
        server_name localhost;
        # Add a response header to verify requests passed through this NGINX
        add_header X-Served-By "nginx" always;
        # Return 429 when the limit is exceeded
        limit_req_status 429;

        # Specific stricter rules for sensitive endpoints
        location = /api/auth/login {
            limit_req zone=perip_login burst=5 nodelay;
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/registrations {
            limit_req zone=perip_registrations burst=50 nodelay;
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default for other API endpoints: allow reasonable bursts
        location = /api/auth/register {
            limit_req zone=perip_register burst=5 nodelay;
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/auth/refresh {
            limit_req zone=perip_refresh burst=10 nodelay;
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default for other API endpoints: allow reasonable bursts
        location /api/ {
            limit_req zone=perip_default burst=100 nodelay;
            set $backend_upstream http://backend:3000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            set $frontend_upstream http://frontend:5173;
            proxy_pass $frontend_upstream;
        }

        # Health endpoint
        location = /health {
            return 200 '{"status":"OK","gateway":true}';
        }
    }
}
