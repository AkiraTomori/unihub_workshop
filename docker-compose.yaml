services:
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: unihub_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: /api
      VITE_API_PROXY_TARGET: http://nginx:8080
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: unihub_backend
    ports:
      - "3000:3000"
    env_file:
      - ./src/backend/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_dev_password}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-workshop_user}:${RABBITMQ_PASSWORD:-rabbitmq_local_dev_password}@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: npm run start

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: unihub_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: unihub_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  ai-summary-worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: unihub_ai_summary_worker
    env_file:
      - ./src/backend/.env
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_dev_password}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-workshop_user}:${RABBITMQ_PASSWORD:-rabbitmq_local_dev_password}@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    command: npm run worker:ai-summary

  csv-sync-worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: unihub_csv_sync_worker
    env_file:
      - ./src/backend/.env
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_dev_password}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-workshop_user}:${RABBITMQ_PASSWORD:-rabbitmq_local_dev_password}@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    command: npm run worker:csv-sync

  notification-worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: unihub_notification_worker
    env_file:
      - ./src/backend/.env
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_dev_password}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-workshop_user}:${RABBITMQ_PASSWORD:-rabbitmq_local_dev_password}@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    command: npm run worker:notification

  outbox-worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: unihub_outbox_worker
    env_file:
      - ./src/backend/.env
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_local_dev_password}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-workshop_user}:${RABBITMQ_PASSWORD:-rabbitmq_local_dev_password}@rabbitmq:5672
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    command: npm run worker:outbox

  redis:
    image: redis:7-alpine
    container_name: unihub_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_local_dev_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_local_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: unihub_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-workshop_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_local_dev_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:stable-alpine
    container_name: unihub_nginx
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  frontend_node_modules:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
